[package]
name = "tokenflow-desktop"
version = "0.2.0"
description = "TokenFlow dashboard and local collector"
authors = ["RenaissanceMind"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json", "native-tls", "system-proxy"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
url = "2"
cookie = "0.18"
time = { version = "0.3", features = ["parsing", "formatting"] }
semver = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
