<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">TokenFlow</title>
  <desc id="desc">Three flowing folded petals in Gemini-inspired blue, Claude-inspired orange and GPT-inspired green on white. All petals share identical geometry, rotated 120 degrees around the center.</desc>
  <defs>
    <linearGradient id="blue" x1="468" y1="602" x2="971" y2="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78b7ff"/>
      <stop offset="0.47" stop-color="#5684d1"/>
      <stop offset="1" stop-color="#3978e2"/>
    </linearGradient>
    <linearGradient id="orange" x1="468" y1="602" x2="971" y2="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8a17a"/>
      <stop offset="0.47" stop-color="#e48a64"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="green" x1="468" y1="602" x2="971" y2="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47d6b1"/>
      <stop offset="0.53" stop-color="#10a37f"/>
      <stop offset="1" stop-color="#06b496"/>
    </linearGradient>
    <linearGradient id="fold" x1="579" y1="615" x2="769" y2="893" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082b36" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#082b36" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#082b36" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="turn" x1="978" y1="735" x2="803" y2="937" gradientUnits="userSpaceOnUse">
