      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <g id="petal" transform="translate(43.8 48) scale(0.94)">
      <path d="M552 548C489 611 509 701 588 750C710 830 877 766 1038 699C1061 690 1051 754 1033 820C981 939 859 1014 717 1011C559 1016 426 921 409 793C392 686 447 585 552 548Z"/>
      <path fill="url(#fold)" d="M552 548C489 611 509 701 588 750C710 830 877 766 1038 699C976 773 895 913 787 913C680 921 587 873 535 799C483 727 496 614 552 548Z"/>
      <path fill="url(#turn)" d="M1038 699C1061 690 1051 754 1033 820C970 916 881 947 787 913C895 913 976 773 1038 699Z"/>
    </g>
  </defs>
  <rect id="background" width="1254" height="1254" fill="#ffffff"/>
