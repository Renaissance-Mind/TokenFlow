name: Build TokenFlow Desktop
on:
  workflow_dispatch:
  push:
    branches: [caopu/tokenflow-tauri]
    paths: [desktop/**, src/**, package.json, package-lock.json, .github/workflows/desktop-build.yml]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: mac-arm64
          - os: macos-15-intel
            platform: mac
            artifact: mac-x64
          - os: windows-latest
            platform: win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        if: matrix.platform == 'mac'
      - name: Build Tauri installer
        run: npm run dist:${{ matrix.platform }} --prefix desktop -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: npm run typecheck --prefix desktop
      - run: npm test --prefix desktop
      - name: Test native WebView and collector
        run: npm run smoke --prefix desktop
      - name: Test macOS app outside checkout
        if: matrix.platform == 'mac'
        run: node desktop/scripts/packaged-smoke.mjs
      - name: Install and test Windows EXE
        if: matrix.platform == 'win'
        run: node desktop/scripts/installer-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tokenflow-tauri-${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/macos/*.tar.gz*
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 14
