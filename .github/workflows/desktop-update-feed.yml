name: Publish desktop update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published desktop release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-update-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix desktop --ignore-scripts
      - name: Publish verified manifests for the newest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node desktop/scripts/publish-update-feed.mjs "$RELEASE_TAG"
